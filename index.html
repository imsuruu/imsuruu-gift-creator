<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f7"><title>ImSuruu — Make a little magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f04d91;--violet:#a64ed0;--ink:#2d263d;--line:#f1dce9}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,#ffe1ee,transparent 34%),linear-gradient(145deg,#fffaf7,#fff0f7 58%,#f4eaff);min-height:100vh}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 900px)/2));background:#ffffffc9;backdrop-filter:blur(12px);border-bottom:1px solid #f4e5ed;position:sticky;top:0;z-index:4}.brand{font-weight:800;font-size:24px;letter-spacing:-1px}.brand b{color:#d94191}.brand i{font-style:normal;color:white;background:linear-gradient(135deg,#ff4789,#9c4bd4);padding:8px 11px;border-radius:13px;margin-right:7px}.tiny{font-size:10px;letter-spacing:2px;color:#a292a2;font-weight:700}main{max-width:760px;margin:25px auto 65px;padding:0 15px}.meta{display:flex;justify-content:space-between;font-size:13px;color:#81778a;margin:8px 3px}.meta b{color:#d94191}.track{height:7px;background:#eee5ef;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#f04d91,#a64ed0);width:14%;transition:.4s}.steps{display:flex;justify-content:center;gap:clamp(10px,4vw,28px);font-size:21px;margin:20px 0}.steps span{opacity:.25}.steps .on{opacity:1;filter:drop-shadow(0 3px 5px #e9a0c7)}.card{background:#ffffffed;border:1px solid #f0dced;border-radius:28px;padding:clamp(22px,5vw,44px);box-shadow:0 20px 55px #72416c16;min-height:420px}h1{font:700 clamp(28px,5vw,42px) 'Playfair Display';text-align:center;margin:0 0 9px}.desc{text-align:center;color:#857a8b;line-height:1.6;margin:0 auto 27px;max-width:540px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:white;border-radius:17px;padding:15px;color:var(--ink);font-weight:700;min-height:82px}.choice em{font-style:normal;font-size:30px}.choice small{display:block;color:#9a8e9c;font-weight:400;font-size:11px;margin-top:4px}.choice.sel{border:2px solid #e74c98;background:#fff5fa}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:700;color:#bd367b;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid #efd9e7;border-radius:14px;padding:14px;background:#fffdfd;font:16px 'DM Sans';color:#30293d;outline:none}.field textarea{min-height:115px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#e56ba5;box-shadow:0 0 0 4px #fae8f1}.btnrow{display:flex;gap:10px;margin-top:25px}.btn{flex:1;border:0;border-radius:50px;padding:16px 20px;background:#f4edf3;color:#766a7b;font-weight:700;font-size:15px}.primary{background:linear-gradient(100deg,#f84c8d,#ad4bd1);color:white;box-shadow:0 10px 25px #dc4a9638}.hint{font-size:11px;color:#958998;line-height:1.5}.upload{border:1.5px dashed #e6a9c8;border-radius:17px;padding:20px;text-align:center;background:#fff8fb}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.photo{border:1px solid var(--line);padding:7px;border-radius:13px}.photo img{width:100%;height:135px;object-fit:cover;border-radius:9px}.photo input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px}.msg{display:flex;gap:8px;margin:9px 0}.msg input{flex:1}.msg button{border:0;border-radius:12px;color:#a33;background:#fff0f5;padding:0 12px}.output{display:none;text-align:center}.short{font-size:19px;font-weight:700;color:#b33f82;word-break:break-all;background:#fff5fa;padding:14px;border-radius:14px;margin:15px 0}.qr{width:220px;height:220px;object-fit:contain;background:white;padding:10px;border-radius:16px;box-shadow:0 8px 25px #5b2b4c18;margin:12px auto;display:block}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.actions .btn{flex:1 1 145px}footer{text-align:center;color:#a69aa8;font-size:11px;padding:20px}
#show{display:none;position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 25%,#fffaff,#fbe1ed 58%,#e9def8);overflow:auto}.scene{min-height:100dvh;display:none;align-items:center;justify-content:center;text-align:center;padding:35px 18px;position:relative;overflow:hidden}.scene.active{display:flex;animation:sceneIn 1.1s cubic-bezier(.2,.8,.2,1) both}.inside{max-width:680px;position:relative;z-index:2}.script{font:clamp(37px,8vw,72px) 'Dancing Script';color:#bd397d}.serif{font:700 clamp(30px,6vw,55px) 'Playfair Display';color:#4c2945}.copy{font:clamp(19px,4vw,24px) 'Cormorant Garamond';color:#755d70;line-height:1.65;white-space:pre-wrap}.heart{font-size:82px;animation:heartbeat 1.5s infinite}.orb{position:absolute;font-size:25px;color:#ef83b2;animation:drift 8s ease-in-out infinite;opacity:.55}.envelope{width:210px;height:145px;margin:20px auto 28px;position:relative;filter:drop-shadow(0 15px 16px #a54b7b25);animation:envelopeFloat 3s ease-in-out infinite}.envbody{position:absolute;inset:0;background:linear-gradient(145deg,#ffb7d2,#ed6ca7);border-radius:12px}.envflap{position:absolute;top:0;left:0;width:0;height:0;border-left:105px solid transparent;border-right:105px solid transparent;border-top:85px solid #f98ab8;transform-origin:top;animation:flap 2.2s 1s forwards}.envletter{position:absolute;left:25px;right:25px;bottom:15px;height:100px;background:#fffafc;border-radius:8px;animation:letterUp 2.4s 1.5s forwards}.cta{border:0;border-radius:50px;padding:15px 28px;background:linear-gradient(100deg,#f04d91,#a64ed0);color:white;font-weight:700;font-size:15px;box-shadow:0 10px 25px #b7499238;margin-top:23px}.balloon{display:inline-grid;place-items:center;width:90px;height:110px;margin:10px;border-radius:50% 50% 47% 47%;background:linear-gradient(145deg,#ffc1d9,#e84b93);color:white;font-size:26px;box-shadow:inset -8px -9px 16px #b52b6940;animation:balloonBob 3s infinite;cursor:pointer}.balloon:nth-child(2){background:linear-gradient(145deg,#dcbaff,#9e65d3);animation-delay:.5s}.balloon:nth-child(3){background:linear-gradient(145deg,#ffd6c5,#f08d9e);animation-delay:1s}.memory{width:min(76vw,330px);height:min(76vw,390px);object-fit:cover;border:11px solid white;border-bottom-width:42px;box-shadow:0 20px 50px #70406b30;transform:rotate(-3deg);animation:photoReveal .8s both}.endglow{font-size:75px;animation:heartbeat 1.5s infinite;filter:drop-shadow(0 0 25px #f47fb4)}@keyframes sceneIn{from{opacity:0;transform:scale(1.035) translateY(18px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes heartbeat{50%{transform:scale(1.14)}}@keyframes drift{50%{transform:translateY(-25px) rotate(12deg)}}@keyframes envelopeFloat{50%{transform:translateY(-10px)}}@keyframes flap{to{transform:rotateX(180deg);opacity:.2}}@keyframes letterUp{to{transform:translateY(-80px)}}@keyframes balloonBob{50%{transform:translateY(-13px) rotate(4deg)}}@keyframes photoReveal{from{opacity:0;transform:translateY(22px) rotate(5deg) scale(.94)}to{opacity:1;transform:rotate(-3deg) scale(1)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.card{border-radius:22px}.steps{gap:13px}.photos{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="brand"><i>♥</i> Im<b>Suruu</b></div><div class="tiny">A LITTLE MAGIC, MADE BY YOU</div></header>
<main id="creator"><div class="meta"><span id="stepNo">Step 1 of 7</span><b id="stepTitle">The occasion</b></div><div class="track"><div class="bar" id="bar"></div></div><div class="steps"><span class="on">✨</span><span>✍️</span><span>🎂</span><span>🎈</span><span>📸</span><span>💌</span><span>🎁</span></div><div class="card" id="card"></div>
<div class="output" id="output"><h1>Your surprise is ready! 💗</h1><p class="desc">Share this short link or let them scan your QR code.</p><div class="short" id="short"></div><img class="qr" id="qr" alt="Surprise QR code"><div class="actions"><button class="btn primary" onclick="copyShort()">Copy short link</button><button class="btn" onclick="downloadQR()">Download QR code</button><button class="btn" onclick="preview()">Preview surprise</button></div><p class="hint" id="status"></p></div></main><footer>Made with love · ImSuruu</footer><div id="show"></div>
<script>
const API='/api/gifts';
let d={occasion:'Birthday',to:'Bachuuu',from:'Suruuu',intro:'A little surprise, made with all my heart.',cake:'Strawberry Bloom',balloons:['You make my world softer and brighter.','Your smile is my favourite place.','You are loved more than words can say.'],photos:[],letter:'Some people make ordinary days feel magical. You are one of those people. I hope you always remember how special you are to me. ❤️',shayari:'तेरी मुस्कान से रोशन मेरी हर शाम रहे,\nतेरे नाम ये छोटा सा पैग़ाम रहे।',closing:'Forever your well-wisher ♥',song:''};
let step=0,songData='',gift=null,mem=0,shortUrl='';
const titles=['The occasion','About them','The cake','The balloons','The memories','Your letter','The finishing touch'];
const card=document.getElementById('card');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){document.getElementById('stepNo').textContent=`Step ${step+1} of 7`;document.getElementById('stepTitle').textContent=titles[step];document.getElementById('bar').style.width=(step+1)/7*100+'%';document.querySelectorAll('.steps span').forEach((e,i)=>e.classList.toggle('on',i<=step));document.getElementById('output').style.display='none';card.style.display='block';let x='';
if(step===0)x=`<h1>Let's make something magical ✨</h1><p class="desc">Choose the occasion for your surprise.</p><div class="grid">${[['Birthday','🎂','A special birthday surprise'],['Anniversary','💞','Celebrate your story'],['Princess Day','👑','For someone precious'],['Just because','💗','A surprise for no reason'],['Friendship','🫶','A little appreciation'],['Love letter','💌','Say what your heart feels']].map(([v,e,t])=>`<button class="choice ${d.occasion===v?'sel':''}" onclick="d.occasion='${v}';draw()"><em>${e}</em><div>${v}<small>${t}</small></div></button>`).join('')}</div>`;
if(step===1)x=`<h1>Who is this little surprise for? 💬</h1><p class="desc">A couple of details and we're set.</p><div class="field"><label>Their name / nickname</label><input id="to" value="${esc(d.to)}" placeholder="Bachuuu, jaan..."></div><div class="field"><label>Your name</label><input id="from" value="${esc(d.from)}"></div><div class="field"><label>Opening line</label><textarea id="intro">${esc(d.intro)}</textarea></div>`;
if(step===2)x=`<h1>Choose their cake 🎂</h1><p class="desc">A sweet little celebration for ${esc(d.to)}.</p><div class="grid">${[['Chocolate Eclipse','🍫','Dark, rich & celebratory'],['Strawberry Bloom','🍓','Fresh, pink & playful'],['Vanilla Pearl','🤍','Simple & elegant'],['Rainbow Dream','🌈','Bright & joyful']].map(([v,e,t])=>`<button class="choice ${d.cake===v?'sel':''}" onclick="d.cake='${v}';draw()"><em>${e}</em><div>${v}<small>${t}</small></div></button>`).join('')}</div>`;
if(step===3)x=`<h1>Fill their balloons 🎈</h1><p class="desc">Every balloon holds one special message.</p>${d.balloons.map((v,i)=>`<div class="msg"><input id="b${i}" value="${esc(v)}" placeholder="A little reason..."><button onclick="removeB(${i})">×</button></div>`).join('')}<button class="btn" onclick="addB()">＋ Add a balloon</button>`;
if(step===4)x=`<h1>Upload photos to add magic 📸</h1><p class="desc">Choose up to 5 favourite memories.</p><div class="upload">♡ Choose photos from your iPhone<br><input id="files" type="file" accept="image/*" multiple></div><div class="photos">${d.photos.map((p,i)=>`<div class="photo"><img src="${p.src}"><input data-caption="${i}" value="${esc(p.caption)}" placeholder="Add a caption"></div>`).join('')}</div>`;
if(step===5)x=`<h1>A letter from your heart 💌</h1><p class="desc">Write something they can keep close.</p><div class="field"><label>Your heartfelt letter</label><textarea id="letter" style="min-height:150px">${esc(d.letter)}</textarea></div><div class="field"><label>Hindi / Hinglish shayari</label><textarea id="shayari">${esc(d.shayari)}</textarea></div>`;
if(step===6)x=`<h1>One last touch ✨</h1><p class="desc">Choose a short song and your final words.</p><div class="field"><label>Background song (optional)</label><input id="song" type="file" accept="audio/*"><p class="hint" id="songLabel">${songData?'Song selected ✓':'Upload audio under 700 KB. Music begins after recipient taps Open.'}</p></div><div class="field"><label>Final message</label><textarea id="closing">${esc(d.closing)}</textarea></div>`;
card.innerHTML=x+`<div class="btnrow">${step?'<button class="btn" onclick="back()">← Back</button>':''}<button class="btn primary" onclick="next()">${step===6?'Create my surprise link ✨':'Continue →'}</button></div>`;
if(step===4){document.getElementById('files').onchange=readPhotos;document.querySelectorAll('[data-caption]').forEach(e=>e.oninput=()=>d.photos[+e.dataset.caption].caption=e.value)}
if(step===6)document.getElementById('song').onchange=readSong}
function collect(){if(step===1){d.to=document.getElementById('to').value||'Someone special';d.from=document.getElementById('from').value||'Someone who cares';d.intro=document.getElementById('intro').value}if(step===3)d.balloons=d.balloons.map((_,i)=>document.getElementById('b'+i)?.value||'').filter(Boolean);if(step===5){d.letter=document.getElementById('letter').value;d.shayari=document.getElementById('shayari').value}if(step===6)d.closing=document.getElementById('closing').value}
function next(){collect();if(step<6){step++;draw()}else makeLink()}function back(){collect();step--;draw()}function addB(){collect();if(d.balloons.length<5)d.balloons.push('');draw()}function removeB(i){collect();d.balloons.splice(i,1);draw()}
function readPhotos(e){[...e.target.files].slice(0,5-d.photos.length).forEach(f=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,850/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.photos.push({src:c.toDataURL('image/jpeg',.7),caption:''});draw()};im.src=r.result};r.readAsDataURL(f)})}
function readSong(e){let f=e.target.files[0];if(!f)return;if(f.size>700*1024){alert('Please use audio under 700 KB.');return}let r=new FileReader();r.onload=()=>{songData=r.result;d.song=songData;document.getElementById('songLabel').textContent='Song selected ✓'};r.readAsDataURL(f)}
async function makeLink(){collect();card.style.display='none';document.getElementById('output').style.display='block';document.getElementById('short').textContent='Creating your short link…';document.getElementById('status').textContent='Saving your surprise securely…';try{let res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!res.ok)throw Error('Storage service is not configured yet.');let out=await res.json();shortUrl=location.origin+'/g/'+out.id;document.getElementById('short').textContent=shortUrl;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=12&data='+encodeURIComponent(shortUrl);document.getElementById('status').textContent='Your short link and QR are ready. Send either one to your person.'}catch(e){document.getElementById('short').textContent='Short-link storage is not connected yet.';document.getElementById('status').textContent='This website needs the included Cloudflare Worker + KV setup before it can create real short links. Preview still works on this device.'}}
function copyShort(){navigator.clipboard.writeText(shortUrl).then(()=>alert('Copied! 💗')).catch(()=>prompt('Copy link',shortUrl))}
function downloadQR(){let a=document.createElement('a');a.href=document.getElementById('qr').src;a.download='imsuruu-surprise-qr.png';a.target='_blank';a.click()}
function preview(){showGift(d)}
function scene(inner){return `<section class="scene"><div class="inside">${inner}</div><span class="orb" style="top:12%;left:9%">♡</span><span class="orb" style="top:21%;right:12%;animation-delay:1s">✧</span><span class="orb" style="bottom:14%;left:15%;animation-delay:2s">♥</span></section>`}
function showGift(g){gift=g;mem=0;let p=g.photos||[];let pages=[
`<div class="script">A little surprise for</div><div class="envelope"><div class="envbody"></div><div class="envletter"></div><div class="envflap"></div></div><h1 class="serif">${esc(g.to)}</h1><p class="copy">${esc(g.intro)}</p><button class="cta" onclick="musicStart();go(1)">Open my surprise ✨</button>`,
`<div class="script">Today is all about you</div><div style="font-size:85px;animation:heartbeat 1.5s infinite">🎂</div><h1 class="serif">${esc(g.occasion)} wishes</h1><p class="copy">May your days be filled with love, laughter and little moments that feel like magic.</p><button class="cta" onclick="go(2)">Make a wish ✨</button>`,
`<div class="script">A few little reminders...</div><h1 class="serif">You are special 💞</h1><div>${(g.balloons||[]).map((_,i)=>`<span class="balloon" onclick="pop(this,${i})">♥</span>`).join('')}</div><p class="copy" id="revealText"></p><button class="cta" onclick="go(3)">Keep going ♥</button>`,
p.length?`<div class="script">Our little memories</div><img class="memory" id="memImg" src="${p[0].src}"><p class="copy" id="memCaption">${esc(p[0].caption||'A moment to keep forever ♥')}</p><button class="cta" onclick="nextMem()">Next memory →</button>`:`<div class="script">A memory to keep</div><div style="font-size:85px">🌷</div><p class="copy">Some moments become precious simply because they are shared with you.</p><button class="cta" onclick="go(4)">Continue ♥</button>`,
`<div class="script">From my heart to yours</div><h1 class="serif">A little letter 💌</h1><p class="copy">${esc(g.letter)}</p><p class="copy" style="font:27px 'Dancing Script';margin-top:22px">${esc(g.shayari||'')}</p><button class="cta" onclick="go(5)">One last thing…</button>`,
`<div class="endglow">💖</div><div class="script">Always remember</div><h1 class="serif">${esc(g.to)}, you are loved.</h1><p class="copy">${esc(g.closing)}</p><div class="script" style="font-size:37px">With love, ${esc(g.from)}</div><button class="cta" onclick="go(0)">Replay our little story ↻</button>`];
let root=document.getElementById('show');root.style.display='block';document.body.style.overflow='hidden';root.innerHTML=pages.map(scene).join('')+(g.song?`<audio id="music" src="${g.song}" loop></audio>`:'')+`<button onclick="closeShow()" style="position:fixed;top:13px;right:13px;z-index:5;border:0;background:#ffffffc9;border-radius:50%;width:42px;height:42px;font-size:20px">×</button>`;go(0)}
let current=0;function go(i){current=i;document.querySelectorAll('#show .scene').forEach((s,n)=>s.classList.toggle('active',n===i))}
function musicStart(){let a=document.getElementById('music');if(a)a.play().catch(()=>{})}
function pop(el,i){document.getElementById('revealText').textContent=gift.balloons[i];el.textContent='✨';el.style.opacity='.4'}
function nextMem(){let p=gift.photos;mem=(mem+1)%p.length;document.getElementById('memImg').src=p[mem].src;document.getElementById('memCaption').textContent=p[mem].caption||'A moment to keep forever ♥';if(mem===p.length-1){let b=document.querySelector('#show .scene.active .cta');b.textContent='Continue to my letter →';b.onclick=()=>go(4)}}
function closeShow(){document.getElementById('show').style.display='none';document.body.style.overflow=''}
async function loadGift(){let m=location.pathname.match(/^\/g\/([a-zA-Z0-9_-]+)$/);if(!m)return;try{let r=await fetch('/api/gifts/'+m[1]);if(!r.ok)throw 0;let g=await r.json();document.getElementById('creator').style.display='none';document.querySelector('footer').style.display='none';showGift(g)}catch(e){document.body.innerHTML='<main><h1>Surprise not found 💔</h1><p>This link may have expired or is incorrect.</p></main>'}}
draw();loadGift();
</script></body></html>
